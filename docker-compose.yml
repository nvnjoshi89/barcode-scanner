  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: barcode-minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: barcode-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped

  mysql:
    image: mysql:8
    container_name: barcode-mysql
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: barcode_db
      MYSQL_USER: barcode_user
      MYSQL_PASSWORD: barcode_pass
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  minio_data:
  redis_data:
  mysql_data:
